
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AnilSunny AI Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">

            <div class="header-info">

                <div class="bot-icon">🤖</div>

                <div>
                    <h2>Sunny AI Assistant</h2>
                    <p>Powered by Ollama | Qwen2.5:3B</p>
                </div>

            </div>

            <button class="clear-btn" onclick="clearChat()">
                Clear Chat
            </button>

        </div>


        <!-- Chat messages -->
        <div id="chat-box" class="chat-box">

            <div class="message bot">

                <div class="avatar">🤖</div>

                <div class="message-content">
                    Hello! Welcome to Sunny AI Chatbot.

                    How can I help you today?
                </div>

            </div>

        </div>


        <!-- User input -->
        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask me anything..."
                autocomplete="off"
            >

            <button id="send-btn" onclick="sendMessage()">
                Send ➤
            </button>

        </div>


        <!-- Footer -->
        <div class="footer">
            Local AI Chatbot | Flask + Ollama + Qwen2.5:3B
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
